<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edimax Group | 後台管理系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="返回集團網站">
        <span class="brand-mark">訊舟集團</span>
        <span class="brand-submark">EDIMAX GROUP</span>
      </a>
      <nav class="main-nav" aria-label="後台導覽">
        <a href="index.html#matrix">回到主頁</a>
        <a href="#admin">內容管理</a>
      </nav>
      <a class="header-action" href="index.html">返回前台</a>
    </header>

    <main>
      <section id="authGate" class="auth-section">
        <form id="authForm" class="auth-card">
          <span class="eyebrow">CMS Access</span>
          <h1 id="authTitle">後台登入</h1>
          <p id="authDescription">請使用管理帳號登入後台。</p>
          <label id="authNameField" hidden>
            <span>管理員名稱</span>
            <input id="authNameInput" type="text" autocomplete="name" />
          </label>
          <label>
            <span>Email</span>
            <input id="authEmailInput" type="email" autocomplete="username" required />
          </label>
          <label>
            <span>密碼</span>
            <input id="authPasswordInput" type="password" autocomplete="current-password" minlength="8" required />
          </label>
          <div id="authMessage" class="form-message" aria-live="polite"></div>
          <button id="authSubmitButton" type="submit">登入</button>
        </form>
      </section>

      <section id="adminApp" hidden>
      <section id="admin" class="section admin-section">
        <div class="section-heading compact">
          <span class="eyebrow">CMS Preview</span>
          <h2>簡易後台管理系統</h2>
          <p>第一版以內容維護為主，讓集團網站可以持續更新，而不是一次性形象頁。</p>
        </div>
        <div class="admin-shell">
          <aside class="admin-menu" aria-label="內容分類">
            <strong>CMS</strong>
            <button class="active" type="button" data-collection="pageSettings">首頁設定</button>
            <button type="button" data-collection="companies">公司資料</button>
            <button type="button" data-collection="solutions">解決方案</button>
            <button type="button" data-collection="cases">合作案例</button>
            <button type="button" data-collection="contacts">聯絡我們</button>
          </aside>
          <div class="admin-main">
            <div class="admin-topbar">
              <div>
                <strong id="adminTitle">公司資料</strong>
                <span id="adminSummary">已發布 0 · 草稿 0</span>
              </div>
              <div class="admin-account-actions">
                <span id="currentUserLabel"></span>
                <button id="manageUsersButton" type="button" class="ghost-button">帳號管理</button>
                <button id="logoutButton" type="button" class="ghost-button">登出</button>
                <button id="newContentButton" type="button">新增內容</button>
              </div>
            </div>
            <div class="admin-workspace">
              <form id="contentForm" class="admin-form">
                <input type="hidden" id="contentId" />
                <div class="form-grid">
                  <label>
                    <span>標題</span>
                    <input id="titleInput" type="text" required />
                  </label>
                  <label data-field="eyebrow">
                    <span>眉標</span>
                    <input id="eyebrowInput" type="text" />
                  </label>
                  <label data-field="shortName">
                    <span>短名稱</span>
                    <input id="shortNameInput" type="text" />
                  </label>
                  <label data-field="type">
                    <span>案例類型</span>
                    <input id="typeInput" type="text" />
                  </label>
                  <label data-field="accent">
                    <span>色彩</span>
                    <select id="accentInput">
                      <option value="red">紅色</option>
                      <option value="blue">藍色</option>
                      <option value="green">綠色</option>
                      <option value="dark">深色</option>
                    </select>
                  </label>
                  <label data-field="displayStatus">
                    <span>展示狀態</span>
                    <input id="displayStatusInput" type="text" />
                  </label>
                  <label data-field="primaryCtaLabel">
                    <span>主要按鈕文字</span>
                    <input id="primaryCtaLabelInput" type="text" />
                  </label>
                  <label data-field="primaryCtaHref">
                    <span>主要按鈕連結</span>
                    <input id="primaryCtaHrefInput" type="text" />
                  </label>
                  <label data-field="secondaryCtaLabel">
                    <span>次要按鈕文字</span>
                    <input id="secondaryCtaLabelInput" type="text" />
                  </label>
                  <label data-field="secondaryCtaHref">
                    <span>次要按鈕連結</span>
                    <input id="secondaryCtaHrefInput" type="text" />
                  </label>
                  <label data-field="email">
                    <span>Email</span>
                    <input id="emailInput" type="email" />
                  </label>
                  <label data-field="department">
                    <span>部門／用途</span>
                    <input id="departmentInput" type="text" />
                  </label>
                  <label class="wide" data-field="logo">
                    <span>Logo 路徑</span>
                    <input id="logoInput" type="text" />
                  </label>
                  <label class="wide" data-field="url">
                    <span>公司官網連結</span>
                    <input id="urlInput" type="url" placeholder="https://www.example.com/" />
                    <small>填寫後會顯示在前台「集團成員與能力矩陣」卡片；留空則不顯示按鈕。</small>
                  </label>
                  <label class="wide">
                    <span id="summaryLabel">摘要</span>
                    <textarea id="summaryInput" rows="4" required></textarea>
                  </label>
                  <label class="wide" data-field="tags">
                    <span>標籤，用逗號分隔</span>
                    <input id="tagsInput" type="text" />
                  </label>
                  <label class="wide" data-field="scenarios">
                    <span>適用場景，用逗號分隔</span>
                    <input id="scenariosInput" type="text" />
                  </label>
                  <label class="wide" data-field="capabilities">
                    <span>能力組合，用逗號分隔</span>
                    <input id="capabilitiesInput" type="text" />
                  </label>
                  <label class="wide" data-field="participants">
                    <span>參與公司，用逗號分隔</span>
                    <input id="participantsInput" type="text" />
                  </label>
                  <label class="wide" data-field="relatedCases">
                    <span>關聯案例 ID，用逗號分隔</span>
                    <input id="relatedCasesInput" type="text" />
                  </label>
                  <label class="wide" data-field="relatedSolutions">
                    <span>關聯解決方案 ID，用逗號分隔</span>
                    <input id="relatedSolutionsInput" type="text" />
                  </label>
                  <label class="wide" data-field="image">
                    <span>底圖路徑</span>
                    <input id="imageInput" type="text" />
                  </label>
                  <label class="wide" data-field="background">
                    <span>案例背景 CSS</span>
                    <input id="backgroundInput" type="text" />
                  </label>
                  <label class="checkbox-line" data-field="featured">
                    <input id="featuredInput" type="checkbox" />
                    <span>設為主要案例</span>
                  </label>
                  <label class="checkbox-line" data-field="publicVisible">
                    <input id="publicVisibleInput" type="checkbox" />
                    <span>案例可公開顯示</span>
                  </label>
                  <label class="checkbox-line" data-field="anonymous">
                    <input id="anonymousInput" type="checkbox" />
                    <span>案例以匿名方式呈現</span>
                  </label>
                  <label data-field="companiesEyebrow">
                    <span>集團成員眉標</span>
                    <input id="companiesEyebrowInput" type="text" />
                  </label>
                  <label data-field="companiesTitle">
                    <span>集團成員標題</span>
                    <input id="companiesTitleInput" type="text" />
                  </label>
                  <label class="wide" data-field="companiesSummary">
                    <span>集團成員說明</span>
                    <textarea id="companiesSummaryInput" rows="3"></textarea>
                  </label>
                  <label data-field="solutionsEyebrow">
                    <span>方案區眉標</span>
                    <input id="solutionsEyebrowInput" type="text" />
                  </label>
                  <label data-field="solutionsTitle">
                    <span>方案區標題</span>
                    <input id="solutionsTitleInput" type="text" />
                  </label>
                  <label class="wide" data-field="solutionsSummary">
                    <span>方案區說明</span>
                    <textarea id="solutionsSummaryInput" rows="3"></textarea>
                  </label>
                  <label data-field="contactEyebrow">
                    <span>聯絡區眉標</span>
                    <input id="contactEyebrowInput" type="text" />
                  </label>
                  <label data-field="contactTitle">
                    <span>聯絡區標題</span>
                    <input id="contactTitleInput" type="text" />
                  </label>
                  <label class="checkbox-line">
                    <input id="publishedInput" type="checkbox" />
                    <span id="publishedLabel">發布到前台</span>
                  </label>
                </div>
                <div id="formMessage" class="form-message" aria-live="polite"></div>
                <div class="form-actions">
                  <button type="submit">儲存內容</button>
                  <button id="cancelEditButton" type="button" class="ghost-button">取消編輯</button>
                </div>
              </form>
              <div class="admin-table" role="table" aria-label="後台內容列表">
                <div class="admin-row header" role="row">
                  <span>內容</span><span>補充資訊</span><span>狀態</span><span>操作</span>
                </div>
                <div id="contentRows"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
      </section>

      <dialog id="accountDialog" class="account-dialog">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">Access Control</span>
            <h2>帳號與權限</h2>
          </div>
          <button id="closeAccountDialogButton" type="button" class="icon-button" aria-label="關閉">×</button>
        </div>
        <form id="accountForm" class="account-form">
          <label>
            <span>使用者名稱</span>
            <input id="accountNameInput" type="text" required />
          </label>
          <label>
            <span>Email</span>
            <input id="accountEmailInput" type="email" required />
          </label>
          <label>
            <span>密碼</span>
            <input id="accountPasswordInput" type="password" minlength="8" required />
          </label>
          <label>
            <span>角色</span>
            <select id="accountRoleInput">
              <option value="editor">編輯者</option>
              <option value="admin">管理員</option>
            </select>
          </label>
          <div id="accountMessage" class="form-message" aria-live="polite"></div>
          <button type="submit">建立帳號</button>
        </form>
        <div id="accountRows" class="account-rows"></div>
      </dialog>
    </main>
    <script src="cms-data.js"></script>
    <script src="cms-contacts-data.js"></script>
    <script src="cms-store.js"></script>
    <script src="admin-auth.js"></script>
    <script src="admin-cms.js"></script>
  </body>
</html>
